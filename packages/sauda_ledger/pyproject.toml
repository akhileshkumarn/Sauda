[project]
name = "sauda-ledger"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sauda-trust", "google-cloud-firestore>=2.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["sauda_ledger"]

[tool.uv.sources]
sauda-trust = { workspace = true }

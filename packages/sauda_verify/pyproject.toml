[project]
name = "sauda-verify"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7", "httpx>=0.27", "google-genai>=1.30", "sauda-trust"]

[tool.uv.sources]
sauda-trust = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["sauda_verify"]

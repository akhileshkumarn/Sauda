[project]
name = "sauda-trust"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8", "google-cloud-kms>=3", "google-cloud-firestore>=2.19", "google-cloud-modelarmor>=0.2", "cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["sauda_trust"]
